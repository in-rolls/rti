# Frozen Telangana initial-batch design. Mirrors in-rolls/rti b2026q3_02,
# adapted to a flat (untiered) frame. Changing anything here means a new
# batch_id AND a new seed — never edit a batch that has been drawn.
batch_id: tg2026q3_02
seed: 20260903
state: Telangana
frame_csv: data/frame_telangana.csv

sampling:
  strategy: department_group_proportional
  n: 250
  cap_per_stratum: 15
  min_stratum_size: 5   # smaller groups pooled into one OTHER stratum

treatments:
  legal_salience:
    n_legal: 75
    n_plain: 175

research_assistants:
  - RA1
  - RA2
  - RA3
  - RA4

templates:
  plain: out/tg2026q3_02/templates/plain_v3.txt
  legal_salience: out/tg2026q3_02/templates/legal_salience_v3.txt

languages:
  default: en

filing:
  portal: https://rti.telangana.gov.in
  fee_inr: 10
  reference_period: "01-08-2025 to 31-07-2026"
