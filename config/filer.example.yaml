# Who files. Stamped into every letter by `rti-render`, so no research
# assistant ever types a name or an address into a portal form and no typo can
# split one filer into two.
#
# `email` should be the address the portal account uses, because that is what
# acknowledgements and replies arrive at.

name: "[FILER NAME]"
address: "[FILER ADDRESS]"
phone: "[FILER PHONE]"
email: "[FILER EMAIL]"
place: "[PLACE]"
citizen_of_india: true
bpl: false
