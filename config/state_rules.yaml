# Per-state RTI rules. Two jobs: putting the right number in the letter, and
# making "was that demand lawful?" a subtraction rather than an RA's judgment.
#
# `statutory_days` is the deadline for a reply to a request made to the PIO
# directly (s.7(1)). It becomes 35 when routed via an APIO (s.5(2)) and 45 for
# security and intelligence organisations under s.24; neither is used here.
#
# Verify each row against the state's own RTI Rules before a batch goes out and
# update `verified_on`. Nothing downstream re-checks these numbers for you.

states:
  _default:
    fee_inr: 10
    per_page_fee_inr: 2
    statutory_days: 30
    appeal_fee_inr: 0
    fee_modes: [online, ipo, dd, court_fee_stamp, cash]
    rule_citation: "RTI (Regulation of Fee and Cost) Rules, 2005"
    verified_on: null

