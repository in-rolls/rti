name: Fieldwork checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: r-lib/actions/setup-r@v2.14.0
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2.14.0
      - run: make check
      - run: git diff --exit-code -- data/release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rti-fieldwork
          path: _site/
